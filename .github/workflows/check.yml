# SPDX-License-Identifier: Apache-2.0
# OpenMyGlass: compile JniInvocation.cpp for the device (HAVE_ANDROID_OS, NDK r25c) against
# pinned AOSP headers, and check that the device fallback runtime is ART. The full AOSP build
# runs from OpenMyGlass/manifest.
name: check
on:
  push:
    branches: [glass-4.4]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # android-security/android_system_core aosp-4.4, as pinned in OpenMyGlass/manifest.
      SYSTEM_CORE_REPO: https://github.com/android-security/android_system_core
      SYSTEM_CORE_COMMIT: f8b2fe863354f13d12077a29390a8ba991954feb
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch pinned AOSP headers
        run: |
          git init -q "$RUNNER_TEMP/system_core"
          git -C "$RUNNER_TEMP/system_core" fetch -q --depth=1 "$SYSTEM_CORE_REPO" "$SYSTEM_CORE_COMMIT"
          git -C "$RUNNER_TEMP/system_core" checkout -q FETCH_HEAD
      - name: Cache the NDK zip
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ndk.zip
          key: ndk-r25c-769ee342ea75f80619d985c2da990c48b3d8eaf45f48783a2d48870d04b46108
      - name: Fetch the pinned NDK (r25c, the newest with API 19)
        run: |
          zip=$RUNNER_TEMP/ndk.zip
          sum=769ee342ea75f80619d985c2da990c48b3d8eaf45f48783a2d48870d04b46108
          if ! echo "$sum  $zip" | sha256sum -c --status -; then
            curl -fsSL --retry 3 -o "$zip" https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
            echo "$sum  $zip" | sha256sum -c -
          fi
          unzip -q "$zip" 'android-ndk-r25c/toolchains/llvm/*' -d "$RUNNER_TEMP"
          echo "CC_ARM=$RUNNER_TEMP/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi19-clang" >> "$GITHUB_ENV"
      - name: Compile JniInvocation.cpp for the device (syntax and warnings)
        run: |
          # HAVE_SYS_UIO_H and HAVE_ANDROID_OS come from 4.4's force-included AndroidConfig.h
          # (build/core/combo/include/arch/linux-arm) in a real build.
          "${CC_ARM}++" -std=gnu++11 -fsyntax-only -Wall -Werror -DHAVE_SYS_UIO_H \
            -DHAVE_ANDROID_OS=1 -I include/nativehelper -I "$RUNNER_TEMP/system_core/include" \
            JniInvocation.cpp
      - name: The device fallback is libart.so
        run: |
          # Preprocess for the device and read the fallback string that remains.
          out=$("${CC_ARM}++" -std=gnu++11 -E -P -DHAVE_SYS_UIO_H -DHAVE_ANDROID_OS=1 \
            -I include/nativehelper -I "$RUNNER_TEMP/system_core/include" JniInvocation.cpp \
            | grep 'kLibraryFallback =')
          echo "$out"
          test "$(echo "$out" | grep -c '"libart.so"')" = 1
          ! echo "$out" | grep -q libdvm
